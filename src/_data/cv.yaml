# Content of the CV page. Name, role and location come from site.yaml.

# Put your PDF at src/assets/cv.pdf. Set to "" to hide the Download button.
pdf: "/assets/cv.pdf"

summary: "[Two or three sentences: what you do, how many years you’ve done it, and the kind of problems you’re best at.]"

# Newest first. Leave `end` out for your current job (shows "Present").
experience:
  - title: "[Job title]"
    company: "[Company]"
    start: "[MMM YYYY]"
    location: "[City or Remote]"
    highlights:
      - "[Key achievement, ideally with a measurable result]"
      - "[A project you led or owned end to end]"
      - "[Scope: team size, systems, or users you were responsible for]"
  - title: "[Job title]"
    company: "[Company]"
    start: "[MMM YYYY]"
    end: "[MMM YYYY]"
    location: "[City or Remote]"
    highlights:
      - "[Key achievement, ideally with a measurable result]"
      - "[A project you led or owned end to end]"
  - title: "[Job title]"
    company: "[Company]"
    start: "[MMM YYYY]"
    end: "[MMM YYYY]"
    location: "[City or Remote]"
    highlights:
      - "[Key achievement, ideally with a measurable result]"
      - "[A project you led or owned end to end]"

education:
  - degree: "[Degree], [Field of study]"
    school: "[University]"
    start: "[YYYY]"
    end: "[YYYY]"

skills:
  - area: "[Area]"
    items: ["[Skill]", "[Skill]", "[Skill]"]
  - area: "[Area]"
    items: ["[Skill]", "[Skill]", "[Skill]"]
  - area: "[Area]"
    items: ["[Skill]", "[Skill]", "[Skill]"]

languages:
  - language: "[Language]"
    level: "[Native / Fluent / B2…]"
  - language: "[Language]"
    level: "[Native / Fluent / B2…]"
